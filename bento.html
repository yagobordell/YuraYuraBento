<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yura Yura Bento - V6 (Ultra-Sticky & Stable)</title>
    <style>
        body { margin: 0; background-color: #2c3e50; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: white; overflow: hidden; }
        #game-container { position: relative; margin-top: 20px; }
        canvas { background-color: #34495e; border-radius: 10px; }
        #ui-layer { position: absolute; top: 20px; left: 20px; pointer-events: none; width: 460px; }
        h1 { margin: 0; font-size: 24px; }
        p { margin: 5px 0 0 0; font-size: 16px; color: #bdc3c7; }
        
        #cooldown-container { width: 100px; height: 10px; background: #7f8c8d; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        #cooldown-bar { width: 100%; height: 100%; background: #2ecc71; transition: none; }
        
        #eat-btn { pointer-events: auto; background: #e67e22; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #d35400; }
        #eat-btn:hover { background: #f39c12; }
        #eat-btn.active { background: #e74c3c; box-shadow: inset 0 4px 0 #c0392b; transform: translateY(4px); }

        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(231, 76, 60, 0.9); padding: 30px; border-radius: 15px; text-align: center; }
        #game-over button { background: white; color: #e74c3c; border: none; padding: 10px 20px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 15px; pointer-events: auto;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <h1>Score: <span id="score">0</span></h1>
            <p id="next-item">Next: Loading...</p>
            <div id="cooldown-container"><div id="cooldown-bar"></div></div>
            
            <button id="eat-btn">🥢 Take a Bite (<span id="bites-count">3</span> left)</button>
            <p style="font-size: 12px; color:#f1c40f;">Earn 1 Bite every 10 points!</p>
        </div>
        <div id="game-over">
            <h2>TOWER COLLAPSED!</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="location.reload()">Try Again</button>
        </div>
    </div>

    <script>
        const Engine = Matter.Engine, Render = Matter.Render, Runner = Matter.Runner,
              Bodies = Matter.Bodies, Composite = Matter.Composite, Events = Matter.Events,
              Constraint = Matter.Constraint, Query = Matter.Query, Vector = Matter.Vector;

        const engine = Engine.create();
        engine.gravity.y = 1.0; 
        
        // --- V6 ENGINE OVERCLOCKING ---
        // By increasing iterations, the engine solves complex overlaps without shaking/jittering
        engine.positionIterations = 12; // Default is 6
        engine.velocityIterations = 8;  // Default is 4

        const width = 500;
        const height = 700;

        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: { width: width, height: height, wireframes: false, background: 'transparent' }
        });

        let score = 0;
        let bites = 3;
        let isGameOver = false;
        let canDrop = true; 
        let isEatMode = false;
        let activeFoods = [];
        let mouseXTracker = width / 2;
        let existingJoints = new Set(); 

        const boxOptions = { isStatic: true, render: { fillStyle: '#c0392b' }, friction: 1.0 };
        const ground = Bodies.rectangle(width / 2, height - 30, 320, 30, boxOptions);
        const leftWall = Bodies.rectangle(width / 2 - 145, height - 150, 30, 250, boxOptions);
        const rightWall = Bodies.rectangle(width / 2 + 145, height - 150, 30, 250, boxOptions);
        Composite.add(engine.world, [ground, leftWall, rightWall]);

        // V6 PHYSICS TWEAK: ALL restitution (bounce) set strictly to 0 to prevent micro-vibrations
        const foodTypes = [
            { name: "Onigiri (Anchor)", shape: 'rectangle', w: 75, h: 75, color: '#ecf0f1', physics: { density: 0.1, friction: 1.0, frictionStatic: 20, restitution: 0, angularDamping: 0.8 } }, 
            { name: "Tomato (Round)", shape: 'circle', r: 28, color: '#e74c3c', physics: { density: 0.04, friction: 1.0, frictionStatic: 15, restitution: 0, angularDamping: 0.5 } }, 
            { name: "Tamagoyaki (Block)", shape: 'rectangle', w: 90, h: 45, color: '#f1c40f', physics: { density: 0.05, friction: 1.0, frictionStatic: 20, restitution: 0, angularDamping: 0.9 } },
            { name: "Nori Sheet (Floor Reset)", shape: 'rectangle', w: 180, h: 15, color: '#27ae60', physics: { density: 0.08, friction: 1.0, frictionStatic: 30, restitution: 0, angularDamping: 0.99 } }
        ];

        let nextFoodIndex = Math.floor(Math.random() * foodTypes.length);
        let previewBody;

        const eatBtn = document.getElementById('eat-btn');
        eatBtn.addEventListener('click', () => {
            if (bites > 0 && !isGameOver) {
                isEatMode = !isEatMode;
                eatBtn.classList.toggle('active');
                eatBtn.innerText = isEatMode ? "Cancel Bite" : `🥢 Take a Bite (${bites} left)`;
                if (isEatMode && previewBody) { Composite.remove(engine.world, previewBody); previewBody = null; }
                else { updatePreview(); }
            }
        });

        function updatePreview() {
            if (previewBody) { Composite.remove(engine.world, previewBody); previewBody = null; }
            if (isGameOver || !canDrop || isEatMode) return; 

            let food = foodTypes[nextFoodIndex];
            let startX = Math.max(70, Math.min(mouseXTracker, width - 70)); 
            let options = { isStatic: true, isSensor: true, render: { fillStyle: food.color, opacity: 0.5 } };
            
            previewBody = food.shape === 'circle' ? 
                Bodies.circle(startX, 80, food.r, options) : 
                Bodies.rectangle(startX, 80, food.w, food.h, Object.assign({}, options, { chamfer: { radius: 5 } }));
            Composite.add(engine.world, previewBody);
            document.getElementById('next-item').innerText = "Next: " + food.name;
        }

        render.canvas.addEventListener('mousemove', (e) => {
            let rect = render.canvas.getBoundingClientRect();
            mouseXTracker = e.clientX - rect.left;
            if (canDrop && !isEatMode) updatePreview();
        });

        render.canvas.addEventListener('mousedown', (e) => {
            if (isGameOver) return;
            
            let rect = render.canvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            // EAT MODE
            if (isEatMode) {
                let clickedBodies = Query.point(activeFoods, { x: clickX, y: clickY });
                if (clickedBodies.length > 0) {
                    let bodyToRemove = clickedBodies[0];
                    
                    // NEW: Clean up any sticky joints attached to the eaten food so the engine doesn't crash
                    let jointsToRemove = Composite.allConstraints(engine.world).filter(c => c.bodyA === bodyToRemove || c.bodyB === bodyToRemove);
                    Composite.remove(engine.world, jointsToRemove);
                    
                    Composite.remove(engine.world, bodyToRemove);
                    activeFoods = activeFoods.filter(f => f !== bodyToRemove);
                    
                    bites--;
                    isEatMode = false;
                    eatBtn.classList.remove('active');
                    eatBtn.innerText = `🥢 Take a Bite (${bites} left)`;
                    if (bites === 0) eatBtn.style.opacity = 0.5;
                    updatePreview();
                }
                return;
            }

            // DROP LOGIC
            if (!canDrop) return;
            let dropX = Math.max(70, Math.min(clickX, width - 70));
            let food = foodTypes[nextFoodIndex];
            let options = Object.assign({}, food.physics, { render: { fillStyle: food.color } });
            
            let newBody = food.shape === 'circle' ? 
                Bodies.circle(dropX, 80, food.r, options) : 
                Bodies.rectangle(dropX, 80, food.w, food.h, Object.assign({}, options, { chamfer: { radius: 5 } }));

            Matter.Body.setAngle(newBody, (Math.random() * 0.1) - 0.05); 
            Composite.add(engine.world, newBody);
            activeFoods.push(newBody);

            score++;
            document.getElementById('score').innerText = score;
            
            if (score % 10 === 0) {
                bites++;
                eatBtn.style.opacity = 1;
                eatBtn.innerText = `🥢 Take a Bite (${bites} left)`;
            }

            canDrop = false;
            document.getElementById('next-item').innerText = "Wait...";
            if (previewBody) { Composite.remove(engine.world, previewBody); previewBody = null; }
            
            let bar = document.getElementById('cooldown-bar');
            bar.style.transition = 'none'; bar.style.width = '0%';
            setTimeout(() => { bar.style.transition = 'width 1s linear'; bar.style.width = '100%'; }, 50);

            setTimeout(() => {
                if(isGameOver) return;
                nextFoodIndex = Math.floor(Math.random() * foodTypes.length);
                canDrop = true;
                if (!isEatMode) updatePreview();
            }, 1000);
        });

        // --- V6 SQUISHY JOINT FIX ---
        setInterval(() => {
            if (isGameOver) return;
            
            let pairs = engine.pairs.list;
            for (let i = 0; i < pairs.length; i++) {
                let bodyA = pairs[i].bodyA;
                let bodyB = pairs[i].bodyB;

                if (!bodyA.isStatic && !bodyB.isStatic) {
                    let jointId = bodyA.id < bodyB.id ? `${bodyA.id}-${bodyB.id}` : `${bodyB.id}-${bodyA.id}`;
                    
                    if (!existingJoints.has(jointId) && bodyA.speed < 0.1 && bodyB.speed < 0.1) {
                        existingJoints.add(jointId);
                        
                        // Calculate exact current distance to prevent them pulling toward each other
                        let dist = Vector.magnitude(Vector.sub(bodyA.position, bodyB.position));
                        
                        let stickyJoint = Constraint.create({
                            bodyA: bodyA,
                            bodyB: bodyB,
                            length: dist, // Lock to exact current distance
                            stiffness: 0.4, // Much higher stiffness (was 0.05). Means HIGH stickiness.
                            damping: 0.1,
                            render: { visible: false }
                        });
                        Composite.add(engine.world, stickyJoint);
                    }
                }
            }
        }, 1000);

        Events.on(engine, 'afterUpdate', function() {
            if (isGameOver) return;
            for (let i = 0; i < activeFoods.length; i++) {
                if (activeFoods[i].position.y > height + 100) {
                    isGameOver = true;
                    if (previewBody) { Composite.remove(engine.world, previewBody); }
                    document.getElementById('game-over').style.display = 'block';
                    document.getElementById('final-score').innerText = score;
                    break;
                }
            }
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);
        updatePreview();

    </script>
</body>
</html>
